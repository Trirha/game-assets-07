<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Glass City</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script defer src="/js/main.js" type="text/javascript"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Glass City Alpha V1.json", { onProgress: UnityProgress });
    </script>
  <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #gameContainer canvas { display: block; width: 100% !important; height: 100% !important; }
      .webgl-content .footer { display: none; }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%;"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Glass City Alpha V1</div>
      </div>
    </div>
  </body>
</html>
