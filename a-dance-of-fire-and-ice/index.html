<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>A Dance of Fire And Ice</title>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/adofaiii4.json");
    </script>
      <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #gameContainer canvas { display: block; width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden; background: #000;">
    <div id="gameContainer" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%;"></div>
    <script>
      // keep the render buffer matched to the window so the game fills the page without stretching/blur
      function fitCanvas() {
        var c = document.querySelector("#gameContainer canvas");
        if (!c) return;
        var w = window.innerWidth, h = window.innerHeight;
        if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
      }
      window.addEventListener("resize", fitCanvas);
      setInterval(fitCanvas, 500);
      window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, { passive: false });
    </script>
  </body>
</html>
